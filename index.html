<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Cadastros - Padaria</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <header class="text-center mb-4">
      <h1><img class="img-fluid w-25" src="img/logo.png" alt="Logotipo Grano Fino"></h1>
    </header>

    <!-- Formulário de cadastro -->
    <section class="card shadow mb-4">
      <div class="card-header">Cadastro</div>
      <div class="card-body">
        <form id="cadastroForm" class="row g-3">
          <div class="col-md-6">
            <label for="nome" class="form-label">Nome Completo</label>
            <input type="text" id="nome" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="nascimento" class="form-label">Data de Nascimento</label>
            <input type="date" id="nascimento" class="form-control" required>
          </div>

          <div class="col-md-4">
            <label for="sexo" class="form-label">Sexo</label>
            <select id="sexo" class="form-select" required>
              <option value="">Selecione</option>
              <option value="Masculino">Masculino</option>
              <option value="Feminino">Feminino</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" class="form-control" required>
          </div>

          <div class="col-md-4">
            <label for="rg" class="form-label">RG</label>
            <input type="text" id="rg" maxlength="12" class="form-control" required>
          </div>

          <div class="col-md-8">
            <label for="pedido" class="form-label">Pedido</label>
            <input type="text" id="pedido" placeholder="Ex: Pão Francês, Donuts" class="form-control">
          </div>

          <div class="col-md-4">
            <label for="quantidade" class="form-label">Quantidade</label>
            <input type="number" id="quantidade" min="1" class="form-control">
          </div>

          <div class="col-12 d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-laranja">Gravar</button>
            <button type="button" class="btn btn-azul" onclick="lerCadastros()">Ler Todos</button>
          </div>
        </form>
      </div>
    </section>

    <!-- JSON gerado -->
    <section class="card shadow mb-4">
      <div class="card-header">JSON Gerado</div>
      <div class="card-body">
        <pre id="jsonOutput">{}</pre>
      </div>
    </section>

    <!-- Lista de cadastros -->
    <section class="card shadow">
      <div class="card-header">Lista de Cadastros</div>
      <div class="card-body tabela-responsiva">
        <ul id="listaNomes" class="list-unstyled"></ul>
      </div>
    </section>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
